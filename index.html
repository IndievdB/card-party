<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Party</title>
  <meta name="description" content="A peer-to-peer tabletop card game. No server, no rules — just cards, friends, and the honor system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1b18'/%3E%3Cg transform='rotate(8 44 33)'%3E%3Crect x='31' y='13' width='24' height='36' rx='4' fill='%232f7d4f'/%3E%3Crect x='34.5' y='16.5' width='17' height='29' rx='2.5' fill='none' stroke='%23ffffff' stroke-opacity='.45' stroke-width='2'/%3E%3C/g%3E%3Cg transform='rotate(-9 24 34)'%3E%3Crect x='11' y='13' width='26' height='38' rx='4' fill='%23f7f1e2'/%3E%3Cline x1='16' y1='22' x2='32' y2='22' stroke='%23b0532a' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='30' x2='28' y2='30' stroke='%23c4baa2' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='36' x2='30' y2='36' stroke='%23c4baa2' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='42' x2='26' y2='42' stroke='%23c4baa2' stroke-width='2.5' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <div class="brand">Card Party</div>
  </header>

  <div id="conn-banner" class="conn-banner hidden">⚠ Connection lost — reconnecting… your seat and cards are safe.</div>

  <main>
    <!-- ============ HOME ============ -->
    <section id="view-home" class="view">
      <div class="hero">
        <label class="field">
          <span>Your name</span>
          <input id="player-name" maxlength="24" placeholder="e.g. Robin" autocomplete="nickname" />
        </label>

        <div class="home-options">
          <div class="option">
            <h2>Host</h2>
            <button id="btn-host" class="btn primary big-btn wide-btn">Host a new room</button>
          </div>
          <div class="option">
            <h2>Join</h2>
            <div class="join-row">
              <input id="join-code" placeholder="ROOM CODE" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" />
              <button id="btn-join" class="btn big-btn">Join</button>
            </div>
            <label class="spectate-row" title="Watch the table without a board of your own — you can claim or start a board any time">
              <input type="checkbox" id="join-spectator" /> Spectate (join without a board)
            </label>
          </div>
          <div class="option">
            <h2>Rejoin</h2>
            <div id="rejoin-box"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ GAME TABLE ============ -->
    <section id="view-game" class="view hidden">
      <div id="game-root"></div>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="fx-layer"></div>
  <div id="card-peek"></div>
  <div id="kw-tip"></div>

  <script src="js/vendor/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
