<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Party — P2P Tabletop</title>
  <meta name="description" content="A peer-to-peer tabletop card game. No server, no rules — just cards, friends, and the honor system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🂡</text></svg>" />
</head>
<body>
  <header class="app-header">
    <div class="brand">Card Party</div>
    <nav>
      <button class="nav-btn" data-nav="home">Home</button>
      <button class="nav-btn" data-nav="game" id="nav-game">Table</button>
    </nav>
  </header>

  <div id="conn-banner" class="conn-banner hidden">⚠ Connection lost — reconnecting… your seat and cards are safe.</div>

  <main>
    <!-- ============ HOME ============ -->
    <section id="view-home" class="view">
      <div class="panel hero">
        <h1>Play cards with up to 10 friends, peer-to-peer.</h1>
        <p class="hint">No server, no accounts, no rules — everything is public and the honor system is the only referee.</p>

        <label class="field">
          <span>Your name</span>
          <input id="player-name" maxlength="24" placeholder="e.g. Robin" autocomplete="nickname" />
        </label>

        <div class="home-actions">
          <button id="btn-host" class="btn primary big-btn">Host a new room</button>
          <div class="join-row">
            <input id="join-code" placeholder="ROOM CODE" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" />
            <button id="btn-join" class="btn big-btn">Join</button>
          </div>
        </div>

        <div id="rejoin-box"></div>
      </div>
    </section>

    <!-- ============ GAME TABLE ============ -->
    <section id="view-game" class="view hidden">
      <div id="game-root"></div>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="fx-layer"></div>
  <div id="card-peek"></div>

  <script src="js/vendor/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
